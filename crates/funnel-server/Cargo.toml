[package]
name = "funnel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
funnel-core = { workspace = true, features = ["openapi", "db"] }

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dashmap = "6"
getrandom = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnetwork.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
quinn.workspace = true
rcgen = "0.13"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
turso.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
urlencoding = "2"
utoipa.workspace = true
scalar_api_reference.workspace = true
uuid.workspace = true

# tls
aws-config = "1"
aws-sdk-route53 = "1"
axum-server = { version = "0.8", features = ["tls-rustls"] }
instant-acme = { version = "0.8", features = ["rcgen"] }
lru = "0.16"
reqwest = { workspace = true, features = ["rustls", "json", "query", "form"] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
x509-parser = "0.18"

[dev-dependencies]
axum-test = "20"
pretty_assertions.workspace = true
sqlx.workspace = true
