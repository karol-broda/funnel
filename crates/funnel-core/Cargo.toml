[package]
name = "funnel-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
hex = "0.4"
http = "1"
nanoid = "0.4"
regex = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["io-util", "rt", "macros"] }
