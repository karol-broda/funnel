[package]
name = "funnel-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
bytes = "1"
http = "1"
nanoid = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
