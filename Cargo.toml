[workspace]
resolver = "3"
members = [
    "crates/funnel-core",
    "crates/funnel-server",
    "crates/funnel-client",
    "crates/funnel-web",
    "crates/funnel-e2e",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/karol-broda/funnel"

[workspace.dependencies]
# internal
funnel-core = { path = "crates/funnel-core" }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# error handling
thiserror = "2"
anyhow = "1"

# networking
quinn = "0.11"
rustls = { version = "0.23", default-features = false }
reqwest = { version = "0.13", default-features = false }

# http
axum = "0.8"
http = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "ipnetwork"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# misc
pretty_assertions = "1"
